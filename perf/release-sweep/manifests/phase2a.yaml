# Phase 2a — transport A/B points (D3, R2, R3) copied verbatim from
# baseline-v0.yaml.  One rep per invocation so the driver can interleave the
# two arms in the PROGRAM §6 alternating order; point configs are unchanged.
# NOTE R2/R3 are the unpaced points P1d documented as short-run (sub stream
# reset after ~1 s); they are kept as authored and reported as burst points.
arm: cmp-061
cc: bbr1
gso: true
hosts:
  shenzhen: {local: true, root: /home/gmarzot/Projects/marzresearch/perf-sweep, python: 'arms/{arm}/venv/bin/python'}
  seawolf: {ssh: seawolf, root: /home/gmarzot/perf-sweep, python: venv/bin/python}
relay: {binary: /home/gmarzot/Projects/marzresearch/moqx/build/moqx, config: perf/release-sweep/moqx-perf.yaml,
  addr: 10.14.25.173, port: 9768, wt_path: /moq-relay, pub_port: 4434, sub_stagger_s: 0.5, admin_url: 'http://[::1]:9769/metrics'}
defaults:
  draft: 16
  duration_s: 60
  interval_s: 5
  warmup_s: 5
  sub_delay_s: 2.0
  reps: 3
  subs: 1
  config: {P: 1, s: 4096, g: 200, r: 0}
  pin: {relay: 0-1, pub: 2-5, sub: 0-3}
points:
- id: D3
  topology: D
  transport: raw
  config: {P: 4, s: 4096, g: 200, r: 0}
  purpose: direct ceiling
  reps: 1
- id: R2
  topology: R
  transport: raw
  config: {P: 4, s: 4096, g: 200, r: 0}
  subs: 1
  purpose: relay ceiling
  reps: 1
- id: R3
  topology: R
  transport: raw
  config: {P: 8, s: 4096, g: 40, r: 0}
  subs: 1
  purpose: relay + churn
  reps: 1
