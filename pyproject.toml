[project]
name = "aiomoqt"
dynamic = ["version"]
description = "Media over QUIC (MoQT) for Python: general-purpose asyncio library for media, agentic and other non-media workflows, with utilities and examples"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Giovanni Marzot", email = "gmarzot@marzresearch.net" }
]
keywords = [
    "moq", "moqt", "media-over-quic", "quic", "webtransport",
    "streaming", "live-streaming", "low-latency", "sub-second-latency",
    "video", "audio", "cmaf", "loc", "relay", "pubsub",
    "asyncio", "ietf", "moq-transport",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: Telecommunications Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: System :: Networking",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "certifi",
    "aiopquic>=0.4.1",
    "sortedcontainers>=2.4.0",
]

[project.urls]
Homepage = "https://github.com/gmarzot/aiomoqt"
Repository = "https://github.com/gmarzot/aiomoqt.git"

[project.scripts]
aiomoqt-versions = "aiomoqt.versions:main"
moq-pub-bench = "aiomoqt.tools.pub_bench:cli"
moq-sub-bench = "aiomoqt.tools.sub_bench:cli"
moq-loopback-bench = "aiomoqt.tools.loopback_bench:cli"
moq-adaptive-bench = "aiomoqt.tools.adaptive_bench:cli"
moq-pub-server = "aiomoqt.tools.pub_server:cli"
moq-load-sim = "aiomoqt.tools.load_sim:cli"
moq-relay-probe = "aiomoqt.tools.relay_probe:cli"
moq-interop-client = "aiomoqt.tools.moq_interop_client:cli"
moq-interop-relay = "aiomoqt.tools.moq_interop_relay:cli"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "ty",
]
examples = [
    "argparse",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # line length handled by formatter

[build-system]
requires = ["setuptools>=77", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aiomoqt*"]
exclude = ["aiomoqt.tests*"]

[tool.setuptools.package-data]
"aiomoqt" = ["py.typed"]
"aiomoqt.tools" = ["scenarios/*.json"]

[tool.setuptools_scm]

