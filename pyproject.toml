[project]
name = "aiomoqt"
dynamic = ["version"]
description = "Python asyncio implementation of the MoQT protocol"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Giovanni Marzot", email = "gmarzot@marzresearch.net" }
]
dependencies = [
    "certifi",
    "aiopquic>=0.4.0rc1",
    "sortedcontainers>=2.4.0",
]

[project.urls]
Homepage = "https://github.com/gmarzot/aiomoqt"
Repository = "https://github.com/gmarzot/aiomoqt.git"

[project.scripts]
aiomoqt-versions = "aiomoqt.versions:main"
moq-pub-bench = "aiomoqt.tools.pub_bench:cli"
moq-sub-bench = "aiomoqt.tools.sub_bench:cli"
moq-loopback-bench = "aiomoqt.tools.loopback_bench:cli"
moq-adaptive-bench = "aiomoqt.tools.adaptive_bench:cli"
moq-pub-server = "aiomoqt.tools.pub_server:cli"
moq-load-sim = "aiomoqt.tools.load_sim:cli"
moq-relay-probe = "aiomoqt.tools.relay_probe:cli"
moq-interop-client = "aiomoqt.tools.moq_interop_client:cli"
moq-interop-relay = "aiomoqt.tools.moq_interop_relay:cli"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "ty",
]
examples = [
    "argparse",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # line length handled by formatter

[build-system]
requires = ["setuptools>=45", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aiomoqt*"]
exclude = ["aiomoqt.tests*"]

[tool.setuptools.package-data]
"aiomoqt.tools" = ["scenarios/*.json"]

[tool.setuptools_scm]

