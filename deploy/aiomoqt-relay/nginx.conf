# MoQ Ersatz Relay site: landing page, G5 broadcast and player pages, the relay dashboard
# and its status files, and the password-protected GoAccess report and relay logs.
server {
    listen 80;
    server_name _;
    server_tokens off;
    return 301 https://aiomoqt-relay.marzresearch.net$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name aiomoqt-relay.marzresearch.net;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/aiomoqt-relay.marzresearch.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aiomoqt-relay.marzresearch.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/g5;
    # Read by GoAccess; errors stay on the container log.
    access_log /var/log/nginx/site/access.log combined;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https:; frame-ancestors 'none'" always;

    # Hashed file names; page HTML is never cached.
    location ^~ /assets/ { expires 1y; }
    location / { try_files $uri $uri/ =404; expires -1; }

    # The relay's --status-dir, shared read-only. Polled every 2 s by each
    # open dashboard, so kept out of the visitor log.
    location = /status/status.json {
        alias /srv/status/status.json;
        expires -1;
        access_log off;
    }
    location = /status/platform.json {
        alias /srv/status/platform.json;
        expires -1;
        access_log off;
    }
    location /status/ { return 404; }

    # Private index: visitor reports and relay logs, same password.
    location /private/ {
        auth_basic "MoQ Ersatz Relay private";
        auth_basic_user_file /etc/nginx/stats.htpasswd;
        access_log off;
        expires -1;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;
    }

    # Relay log viewer and the relay's --log-dir, behind the /stats/ password
    # and realm: the log names peer addresses.
    location /relay/logs/ {
        auth_basic "MoQ Ersatz Relay private";
        auth_basic_user_file /etc/nginx/stats.htpasswd;
        access_log off;
        expires -1;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
    }
    location = /relay/logs/files/ {
        alias /srv/relay-logs/;
        autoindex on;
        autoindex_format json;
        auth_basic "MoQ Ersatz Relay private";
        auth_basic_user_file /etc/nginx/stats.htpasswd;
        access_log off;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }
    # Log files only, as text; the viewer tails them with byte ranges.
    location ~ ^/relay/logs/files/(relay\.log(?:\.[1-9])?|crash\.log)$ {
        alias /srv/relay-logs/$1;
        types { }
        default_type text/plain;
        charset utf-8;
        auth_basic "MoQ Ersatz Relay private";
        auth_basic_user_file /etc/nginx/stats.htpasswd;
        access_log off;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }
    location /relay/logs/files/ { return 404; }

    # GoAccess report. add_header here replaces the server's, so all are
    # repeated; GoAccess pages need inline script and embedded fonts.
    location /stats/ {
        alias /srv/stats/;
        index index.html;
        auth_basic "MoQ Ersatz Relay private";
        auth_basic_user_file /etc/nginx/stats.htpasswd;
        access_log off;
        expires -1;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
    }
}
