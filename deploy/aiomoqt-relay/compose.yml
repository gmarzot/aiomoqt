# aiomoqt-relay: the relay, nginx for the pages and the relay's
# status and logs, and GoAccess for the password-protected visitor report.
# Run from this directory; see README.md.
name: aiomoqt-relay

services:
  relay:
    image: aiomoqt:dev
    # The certbot renewal hook restarts it by this name.
    container_name: aiomoqt-relay
    network_mode: host
    restart: unless-stopped
    # Past the relay's --drain-timeout (2 s, 5 s with --goaway-uri): SIGTERM
    # drains with GOAWAY.
    stop_grace_period: 15s
    mem_limit: 2g
    # Off CPU 0, which takes the NIC interrupts (host/relay-irq-affinity.service).
    cpuset: "1,2"
    # Core files land in ./cores; see README.md for the host's core_pattern.
    ulimits: {core: -1}
    # No capabilities, no privilege gain, read-only root: it binds UDP 4443 and
    # writes only its root-owned mounts (README.md, "First-time setup").
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONFAULTHANDLER: "1"
      # Stream buffers (1 MiB) are mmapped, so freed ones go back to the OS.
      MALLOC_MMAP_THRESHOLD_: "1048576"
      MOQT_ROLE: relay
      MOQT_DUAL: "1"
      MOQT_PORT: "4443"
      MOQT_CERT: /etc/letsencrypt/live/aiomoqt-relay.marzresearch.net/fullchain.pem
      MOQT_KEY: /etc/letsencrypt/live/aiomoqt-relay.marzresearch.net/privkey.pem
    # Relay flags live in relay.toml; flags added here override it.
    command: ["--config", "/etc/aiomoqt-relay/relay.toml"]
    volumes:
      - ./relay.toml:/etc/aiomoqt-relay/relay.toml:ro
      # This certificate only; live/ links into archive/.
      - /etc/letsencrypt/live/aiomoqt-relay.marzresearch.net:/etc/letsencrypt/live/aiomoqt-relay.marzresearch.net:ro
      - /etc/letsencrypt/archive/aiomoqt-relay.marzresearch.net:/etc/letsencrypt/archive/aiomoqt-relay.marzresearch.net:ro
      - ./status:/status
      - ./relay-logs:/logs
      - ./cores:/cores
      # Host OS name for the dashboard; the container's is the image's.
      - /etc/os-release:/host/etc/os-release:ro
    logging:
      options: {max-size: "50m", max-file: "3"}

  web:
    image: nginx:alpine
    container_name: relay-web
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site:/srv/g5:ro
      - ./status:/srv/status:ro
      - ./relay-logs:/srv/relay-logs:ro
      - ./stats:/srv/stats:ro
      - ./stats.htpasswd:/etc/nginx/stats.htpasswd:ro
      - ./logs:/var/log/nginx/site
      - /etc/letsencrypt/live/aiomoqt-relay.marzresearch.net:/etc/letsencrypt/live/aiomoqt-relay.marzresearch.net:ro
      - /etc/letsencrypt/archive/aiomoqt-relay.marzresearch.net:/etc/letsencrypt/archive/aiomoqt-relay.marzresearch.net:ro
    logging:
      options: {max-size: "10m", max-file: "3"}

  goaccess:
    image: allinurl/goaccess:1.9.3
    container_name: relay-goaccess
    restart: unless-stopped
    network_mode: none
    # Off the relay's CPUs; yields to the NIC's softirq work on CPU 0.
    cpuset: "0"
    cpu_shares: 2
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    # Every 5 minutes each report (visitors without crawlers; crawlers alone) parses only the
    # lines added since its last pass into its own database, which keeps 14 days. The latest
    # second's lines wait a pass: goaccess drops lines no newer than the last it stored. After
    # logrotate's copytruncate, the rest of access.log.1 comes first.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        new_lines() {
          seen=$$(cat "$$1/lines" 2>/dev/null || echo 0)
          now=$$(wc -l < /logs/access.log)
          head -n 1 /logs/access.log > "$$1/first.next"
          echo "$$now" > "$$1/lines.next"
          {
            cat "$$1/carry" 2>/dev/null
            if [ "$$now" -lt "$$seen" ] || { [ -s "$$1/first" ] && ! cmp -s "$$1/first" "$$1/first.next"; }; then
              tail -n +$$((seen + 1)) /logs/access.log.1 2>/dev/null
              seen=0
            fi
            tail -n +$$((seen + 1)) /logs/access.log | head -n $$((now - seen))
          } | awk -v carry="$$1/carry.next" '$$4 != t { for (i = 0; i < n; i++) print b[i]; n = 0; t = $$4 }
              { b[n++] = $$0 } END { printf "" > carry; for (i = 0; i < n; i++) print b[i] > carry }'
        }
        report() {
          mkdir -p "$$1"
          new_lines "$$1" | goaccess - --log-format=COMBINED --no-global-config --no-progress "$$4" \
            --persist --restore --db-path="$$1" --keep-last=14 \
            --html-report-title="$$3" -o "/report/new-$$2" || return
          mv "/report/new-$$2" "/report/$$2"
          for f in lines first carry; do mv "$$1/$$f.next" "$$1/$$f"; done
        }
        while :; do
          report /db/visitors index.html "aiomoqt-relay visitors" --ignore-crawlers
          report /db/crawlers crawlers.html "aiomoqt-relay crawlers" --crawlers-only
          sleep 300
        done
    volumes:
      - ./logs:/logs:ro
      - ./stats:/report
      - ./goaccess-db:/db
    logging:
      options: {max-size: "10m", max-file: "3"}

  peers:
    image: python:3.14-slim
    container_name: relay-peers
    restart: unless-stopped
    network_mode: none
    cpuset: "0"
    cpu_shares: 64
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    command: ["python", "/app/peers.py"]
    volumes:
      - ./peers.py:/app/peers.py:ro
      - ./status:/status:ro
      - ./peers:/peers
      - ./stats:/report
    logging:
      options: {max-size: "10m", max-file: "3"}
